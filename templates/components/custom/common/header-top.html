<div class="header-top">
  <div class="container header-top--inner">

    <!-- Left: Logo -->
    <div class="header-top--logo">
      {{#if page_type '===' 'default'}}
      <h1 class="header-logo header-logo--{{theme_settings.logo-position}}">
        {{> components/common/store-logo}}
      </h1>
      {{else}}
      <div class="header-logo header-logo--{{theme_settings.logo-position}}">
        {{> components/common/store-logo}}
      </div>
      {{/if}}
    </div>

    <!-- Center: Search -->
    <div class="header-top--search">
      {{> components/common/quick-search}}
    </div>

    <!-- Right: Phone number -->
    <div class="header-top--phone">
      <i class="icon">
        <svg>
          <use xlink:href="#icon-headset" />
        </svg>
      </i>
      <div class="header-top--phone--links">
        <a {{#if theme_settings.header_booking_newtab}}target="_blank"{{/if}} href="{{theme_settings.header_booking_link}}">{{theme_settings.header_booking_text}}</a>
        <a href="tel:{{settings.phone_number}}">{{settings.phone_number}}</a>
      </div>
    </div>

  </div>
</div>
